name: Run tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    name: Test on ${{matrix.php}}

    strategy:
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4", "8.5", "8.6"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{matrix.php}}

      - name: Install dependencies
        run: composer install

      - name: Run tests
        run: composer test
